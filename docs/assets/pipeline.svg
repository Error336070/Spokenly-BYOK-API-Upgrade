<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="548" viewBox="0 0 1280 548" role="img" aria-labelledby="title desc">
<title id="title">How the proxy works</title>
<desc id="desc">Spokenly sends a WAV recording to the local proxy. The proxy picks a route, re-encodes the audio to FLAC, adds provider options and vocabulary, and sends it to OpenRouter or a native API. The transcript goes back to Spokenly and every request is logged to SQLite.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#151B38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
  <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0891B2" stop-opacity="0.26"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect width="1280" height="548" rx="22"/></clipPath>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker><filter id="soft" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', SFMono-Regular, Consolas, Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
</style>
<g clip-path="url(#round)">
  <rect width="1280" height="548" fill="url(#bg)"/>
  <rect width="1280" height="548" fill="url(#grid)"/>
  
  <ellipse cx="600" cy="280" rx="420" ry="260" fill="url(#glowV)"/>
  <ellipse cx="1090" cy="270" rx="260" ry="240" fill="url(#glowC)"/>
  <text x="40" y="58" font-size="22" font-weight="700" fill="#F1F5F9">How a dictation travels</text>
  <text x="40" y="84" font-size="14" fill="#94A3B8">One request, from push-to-talk to transcript. The dots show live traffic.</text>

  <path id="p-in" d="M240 252 H322" fill="none" stroke="#2A3463" stroke-width="2" marker-end="url(#arrow)"/>
  <path id="p-or" d="M856 230 C 895 230, 895 168, 932 168" fill="none" stroke="#2A3463" stroke-width="2" marker-end="url(#arrow)"/>
  <path id="p-nat" d="M856 290 C 895 290, 895 372, 932 372" fill="none" stroke="#2A3463" stroke-width="2" marker-end="url(#arrow)"/>
  <path id="p-log" d="M590 420 V 466" fill="none" stroke="#2A3463" stroke-width="2" stroke-dasharray="4 5"/>

  <rect x="40" y="182" width="200" height="140" rx="16" fill="#121933" fill-opacity="0.92" stroke="#2A3463" stroke-opacity="1" stroke-width="1.5"/>
  <rect x="128" y="200" width="24" height="38" rx="12" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <path d="M120 226 a20 20 0 0 0 40 0 M140 246 v10" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#F1F5F9">Spokenly</text>
  <text x="140" y="310" text-anchor="middle" font-size="13" fill="#94A3B8">push-to-talk, sends WAV</text>

  <rect x="322" y="120" width="534" height="300" rx="16" fill="#121933" fill-opacity="0.92" stroke="#A78BFA" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="346" y="158" font-size="18" font-weight="700" fill="#F1F5F9">Dictation proxy</text>
  <text class="mono" x="832" y="158" text-anchor="end" font-size="13" fill="#A5B4FC">127.0.0.1:8765</text>
  
    <rect x="352" y="186" width="150" height="132" rx="16" fill="#121933" fill-opacity="0.92" stroke="#A78BFA" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="378" cy="214" r="13" fill="#A78BFA" fill-opacity="0.18" stroke="#A78BFA"/>
    <text x="378" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#A78BFA">1</text>
    <text x="400" y="219" font-size="17" font-weight="700" fill="#F1F5F9">Route</text>
    <text x="368" y="262" font-size="13" fill="#94A3B8">the model name picks</text>
    <text x="368" y="282" font-size="13" fill="#94A3B8">a route in config.yaml</text><path d="M508 252 l10 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <rect x="524" y="186" width="150" height="132" rx="16" fill="#121933" fill-opacity="0.92" stroke="#818CF8" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="550" cy="214" r="13" fill="#818CF8" fill-opacity="0.18" stroke="#818CF8"/>
    <text x="550" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#818CF8">2</text>
    <text x="572" y="219" font-size="17" font-weight="700" fill="#F1F5F9">FLAC</text>
    <text x="540" y="262" font-size="13" fill="#94A3B8">lossless re-encode</text>
    <text x="540" y="282" font-size="13" fill="#94A3B8">45% of the size</text><path d="M680 252 l10 0 m-5 -5 l5 5 l-5 5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <rect x="696" y="186" width="150" height="132" rx="16" fill="#121933" fill-opacity="0.92" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="722" cy="214" r="13" fill="#22D3EE" fill-opacity="0.18" stroke="#22D3EE"/>
    <text x="722" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#22D3EE">3</text>
    <text x="744" y="219" font-size="17" font-weight="700" fill="#F1F5F9">Translate</text>
    <text x="712" y="262" font-size="13" fill="#94A3B8">provider options</text>
    <text x="712" y="282" font-size="13" fill="#94A3B8">and your vocabulary</text>
  <text class="mono" x="346" y="396" font-size="12.5" fill="#94A3B8">keep-warm · hot reload · toasts · 7-day retention</text>

  <rect x="932" y="108" width="308" height="120" rx="16" fill="#121933" fill-opacity="0.92" stroke="#2A3463" stroke-opacity="1" stroke-width="1.5"/>
  <text x="956" y="146" font-size="18" font-weight="700" fill="#F1F5F9">OpenRouter</text>
  <text x="956" y="172" font-size="13" fill="#94A3B8">MAI-Transcribe 2, GPT Transcribe</text>
  <rect x="956" y="186" width="152" height="24" rx="6" fill="#A78BFA" fill-opacity="0.14"/>
  <text class="mono" x="966" y="203" font-size="12.5" fill="#C4B5FD">backend: openrouter</text>

  <rect x="932" y="312" width="308" height="120" rx="16" fill="#121933" fill-opacity="0.92" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="956" y="350" font-size="18" font-weight="700" fill="#F1F5F9">Native API</text>
  <text x="956" y="376" font-size="13" fill="#94A3B8">AssemblyAI Sync, EU endpoint</text>
  <rect x="956" y="390" width="124" height="24" rx="6" fill="#34D399" fill-opacity="0.14"/>
  <text class="mono" x="966" y="407" font-size="12.5" fill="#6EE7B7">backend: native</text>

  <ellipse cx="590" cy="476" rx="96" ry="12" fill="#121933" stroke="#2A3463" stroke-width="1.5"/>
  <path d="M494 476 V 512 a96 12 0 0 0 192 0 V 476" fill="#121933" stroke="#2A3463" stroke-width="1.5"/>
  <ellipse cx="590" cy="476" rx="96" ry="12" fill="#18213F" stroke="#2A3463" stroke-width="1.5"/>
  <text x="590" y="506" text-anchor="middle" font-size="14" font-weight="700" fill="#F1F5F9">SQLite log</text>
  <text x="712" y="500" font-size="13" fill="#94A3B8">latency, cost and transcript for every request</text>

  <circle r="5.5" fill="#A78BFA" filter="url(#soft)"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite"><mpath href="#p-in"/></animateMotion></circle>
  <circle r="5.5" fill="#A78BFA" filter="url(#soft)"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#p-or"/></animateMotion></circle>
  <circle r="5.5" fill="#34D399" filter="url(#soft)"><animateMotion dur="2.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#p-nat"/></animateMotion></circle>
  <circle r="5.5" fill="#22D3EE" filter="url(#soft)"><animateMotion dur="2.6s" begin="2.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p-or"/></animateMotion></circle>
  <circle r="5.5" fill="#34D399" filter="url(#soft)"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p-nat"/></animateMotion></circle>
  <circle r="5.5" fill="#22D3EE" filter="url(#soft)"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p-in"/></animateMotion></circle>
  <circle r="5.5" fill="#94A3B8" filter="url(#soft)"><animateMotion dur="1.8s" begin="0.7s" repeatCount="indefinite"><mpath href="#p-log"/></animateMotion></circle>

</g>
<rect x="0.5" y="0.5" width="1279" height="547" rx="22" fill="none" stroke="#2A3463"/>
</svg>
