<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Spokenly BYOK API Upgrade</title>
<desc id="desc">A local speech-to-text proxy for Spokenly. Short commands come back in about 200 ms, up to 3.2 times faster than before, and the proxy listens on 127.0.0.1 only.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#151B38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
  <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0891B2" stop-opacity="0.26"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect width="1280" height="420" rx="22"/></clipPath>
  <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="500" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', SFMono-Regular, Consolas, Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .bar { transform-box: fill-box; transform-origin: center; animation: talk 1.6s ease-in-out infinite; }
  @keyframes talk { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

</style>
<g clip-path="url(#round)">
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  
  <ellipse cx="290" cy="210" rx="330" ry="230" fill="url(#glowV)"/>
  <ellipse cx="1120" cy="80" rx="380" ry="220" fill="url(#glowC)"/>
  <g><rect class="bar" x="70" y="193.5" width="7" height="33.0" rx="3.5" fill="url(#wave)" style="animation-delay:0.00s"/><rect class="bar" x="83" y="181.7" width="7" height="56.7" rx="3.5" fill="url(#wave)" style="animation-delay:1.51s"/><rect class="bar" x="96" y="181.7" width="7" height="56.7" rx="3.5" fill="url(#wave)" style="animation-delay:1.42s"/><rect class="bar" x="109" y="168.0" width="7" height="84.0" rx="3.5" fill="url(#wave)" style="animation-delay:1.33s"/><rect class="bar" x="122" y="169.0" width="7" height="82.1" rx="3.5" fill="url(#wave)" style="animation-delay:1.24s"/><rect class="bar" x="135" y="158.7" width="7" height="102.7" rx="3.5" fill="url(#wave)" style="animation-delay:1.15s"/><rect class="bar" x="148" y="155.9" width="7" height="108.2" rx="3.5" fill="url(#wave)" style="animation-delay:1.06s"/><rect class="bar" x="161" y="153.6" width="7" height="112.8" rx="3.5" fill="url(#wave)" style="animation-delay:0.97s"/><rect class="bar" x="174" y="143.8" width="7" height="132.5" rx="3.5" fill="url(#wave)" style="animation-delay:0.88s"/><rect class="bar" x="187" y="152.7" width="7" height="114.6" rx="3.5" fill="url(#wave)" style="animation-delay:0.79s"/><rect class="bar" x="200" y="133.8" width="7" height="152.4" rx="3.5" fill="url(#wave)" style="animation-delay:0.70s"/><rect class="bar" x="213" y="155.5" width="7" height="109.1" rx="3.5" fill="url(#wave)" style="animation-delay:0.61s"/><rect class="bar" x="226" y="127.2" width="7" height="165.7" rx="3.5" fill="url(#wave)" style="animation-delay:0.52s"/><rect class="bar" x="239" y="154.0" width="7" height="112.1" rx="3.5" fill="url(#wave)" style="animation-delay:0.43s"/><rect class="bar" x="252" y="124.5" width="7" height="170.9" rx="3.5" fill="url(#wave)" style="animation-delay:0.34s"/><rect class="bar" x="265" y="144.0" width="7" height="131.9" rx="3.5" fill="url(#wave)" style="animation-delay:0.25s"/><rect class="bar" x="278" y="126.1" width="7" height="167.7" rx="3.5" fill="url(#wave)" style="animation-delay:0.16s"/><rect class="bar" x="291" y="136.0" width="7" height="147.9" rx="3.5" fill="url(#wave)" style="animation-delay:0.07s"/><rect class="bar" x="304" y="131.7" width="7" height="156.7" rx="3.5" fill="url(#wave)" style="animation-delay:1.58s"/><rect class="bar" x="317" y="131.1" width="7" height="157.8" rx="3.5" fill="url(#wave)" style="animation-delay:1.49s"/><rect class="bar" x="330" y="140.4" width="7" height="139.3" rx="3.5" fill="url(#wave)" style="animation-delay:1.40s"/><rect class="bar" x="343" y="130.0" width="7" height="160.0" rx="3.5" fill="url(#wave)" style="animation-delay:1.31s"/><rect class="bar" x="356" y="151.0" width="7" height="117.9" rx="3.5" fill="url(#wave)" style="animation-delay:1.22s"/><rect class="bar" x="369" y="133.1" width="7" height="153.8" rx="3.5" fill="url(#wave)" style="animation-delay:1.13s"/><rect class="bar" x="382" y="162.4" width="7" height="95.1" rx="3.5" fill="url(#wave)" style="animation-delay:1.04s"/><rect class="bar" x="395" y="140.3" width="7" height="139.5" rx="3.5" fill="url(#wave)" style="animation-delay:0.95s"/><rect class="bar" x="408" y="163.1" width="7" height="93.8" rx="3.5" fill="url(#wave)" style="animation-delay:0.86s"/><rect class="bar" x="421" y="150.8" width="7" height="118.5" rx="3.5" fill="url(#wave)" style="animation-delay:0.77s"/><rect class="bar" x="434" y="165.1" width="7" height="89.8" rx="3.5" fill="url(#wave)" style="animation-delay:0.68s"/><rect class="bar" x="447" y="163.6" width="7" height="92.8" rx="3.5" fill="url(#wave)" style="animation-delay:0.59s"/><rect class="bar" x="460" y="171.5" width="7" height="77.1" rx="3.5" fill="url(#wave)" style="animation-delay:0.50s"/><rect class="bar" x="473" y="177.6" width="7" height="64.8" rx="3.5" fill="url(#wave)" style="animation-delay:0.41s"/><rect class="bar" x="486" y="182.7" width="7" height="54.5" rx="3.5" fill="url(#wave)" style="animation-delay:0.32s"/><rect class="bar" x="499" y="192.2" width="7" height="35.5" rx="3.5" fill="url(#wave)" style="animation-delay:0.23s"/></g>
  <line x1="508" y1="120" x2="508" y2="300" stroke="#2A3463" stroke-width="1.5"/>
  <text x="560" y="128" font-size="14" font-weight="600" letter-spacing="3.2" fill="#A5B4FC">LOCAL SPEECH-TO-TEXT PROXY FOR SPOKENLY</text>
  <text x="556" y="196" font-size="64" font-weight="700" fill="#F1F5F9">Spokenly BYOK</text>
  <text x="556" y="264" font-size="64" font-weight="700" fill="url(#accent)">API Upgrade<tspan class="cursor" fill="#22D3EE" font-weight="300">|</tspan></text>
  <text x="560" y="304" font-size="20" fill="#94A3B8">Clean, fast dictation through your own API keys.</text>
  <g transform="translate(560 330)"><rect width="168" height="34" rx="17" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.45"/><circle cx="17" cy="17" r="4" fill="#34D399"/><text class="mono" x="29" y="22" font-size="14.5" fill="#F1F5F9">~200 ms commands</text></g><g transform="translate(740 330)"><rect width="177" height="34" rx="17" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.45"/><circle cx="17" cy="17" r="4" fill="#22D3EE"/><text class="mono" x="29" y="22" font-size="14.5" fill="#F1F5F9">up to 3.2x faster</text></g><g transform="translate(929 330)"><rect width="152" height="34" rx="17" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/><circle cx="17" cy="17" r="4" fill="#A78BFA"/><text class="mono" x="29" y="22" font-size="14.5" fill="#F1F5F9">127.0.0.1 only</text></g>

</g>
<rect x="0.5" y="0.5" width="1279" height="419" rx="22" fill="none" stroke="#2A3463"/>
</svg>
