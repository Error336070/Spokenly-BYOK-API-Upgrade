<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
<title id="title">Model shootout results</title>
<desc id="desc">Word error rate against median latency for seven speech-to-text models on the same seven recordings. AssemblyAI had 1.9 percent at 638 ms, MAI-Transcribe 2 had 2.5 percent and kept no filler words, GPT Transcribe had 3.2 percent, and Gemini 3.5 was slowest at 12.1 percent.</desc>
<defs></defs>
<style>
  text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #102A43; font-variant-numeric: tabular-nums; }
  .serif { font-family: Georgia, 'Times New Roman', Times, serif; }
  .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
  .muted { fill: #52667A; }
  
</style>
<rect x="1" y="1" width="1278" height="508" rx="14" fill="#EEF2F6" stroke="#C5D0DB" stroke-width="2"/>

  <text class="serif" x="64" y="72" font-size="28" font-weight="700">Seven models on the same recordings</text><text class="muted" x="64" y="102" font-size="15">Word error rate against median latency, all through OpenRouter.</text>
  <circle cx="760" cy="96" r="7" fill="#102A43"/><text class="muted" x="774" y="101" font-size="13">kept in the default config</text><circle cx="958" cy="96" r="7" fill="#EEF2F6" stroke="#52667A" stroke-width="1.5"/><text class="muted" x="972" y="101" font-size="13">dropped after testing</text><circle cx="1128" cy="96" r="12" fill="none" stroke="#52667A" stroke-width="1.5"/><text class="muted" x="1146" y="101" font-size="13">more fillers</text>
  <rect x="150" y="354" width="424" height="94" fill="#C5D0DB" fill-opacity="0.35"/><text class="muted" x="162" y="436" font-size="13">faster and more accurate</text><line x1="150.0" x2="150.0" y1="142" y2="448" stroke="#C5D0DB"/><text class="muted" x="150.0" y="472" text-anchor="middle" font-size="13">0</text><line x1="326.7" x2="326.7" y1="142" y2="448" stroke="#C5D0DB"/><text class="muted" x="326.7" y="472" text-anchor="middle" font-size="13">500</text><line x1="503.3" x2="503.3" y1="142" y2="448" stroke="#C5D0DB"/><text class="muted" x="503.3" y="472" text-anchor="middle" font-size="13">1,000</text><line x1="680.0" x2="680.0" y1="142" y2="448" stroke="#C5D0DB"/><text class="muted" x="680.0" y="472" text-anchor="middle" font-size="13">1,500</text><line x1="856.7" x2="856.7" y1="142" y2="448" stroke="#C5D0DB"/><text class="muted" x="856.7" y="472" text-anchor="middle" font-size="13">2,000</text><line x1="1033.3" x2="1033.3" y1="142" y2="448" stroke="#C5D0DB"/><text class="muted" x="1033.3" y="472" text-anchor="middle" font-size="13">2,500</text><line x1="1210.0" x2="1210.0" y1="142" y2="448" stroke="#C5D0DB"/><text class="muted" x="1210.0" y="472" text-anchor="middle" font-size="13">3,000 ms</text><line x1="150" x2="1210" y1="448.0" y2="448.0" stroke="#C5D0DB"/><text class="muted" x="138" y="452.0" text-anchor="end" font-size="13">0%</text><line x1="150" x2="1210" y1="400.9" y2="400.9" stroke="#C5D0DB"/><text class="muted" x="138" y="404.9" text-anchor="end" font-size="13">2%</text><line x1="150" x2="1210" y1="353.8" y2="353.8" stroke="#C5D0DB"/><text class="muted" x="138" y="357.8" text-anchor="end" font-size="13">4%</text><line x1="150" x2="1210" y1="306.8" y2="306.8" stroke="#C5D0DB"/><text class="muted" x="138" y="310.8" text-anchor="end" font-size="13">6%</text><line x1="150" x2="1210" y1="259.7" y2="259.7" stroke="#C5D0DB"/><text class="muted" x="138" y="263.7" text-anchor="end" font-size="13">8%</text><line x1="150" x2="1210" y1="212.6" y2="212.6" stroke="#C5D0DB"/><text class="muted" x="138" y="216.6" text-anchor="end" font-size="13">10%</text><line x1="150" x2="1210" y1="165.5" y2="165.5" stroke="#C5D0DB"/><text class="muted" x="138" y="169.5" text-anchor="end" font-size="13">12%</text><text class="muted" x="138" y="126" text-anchor="end" font-size="13">word errors</text><circle cx="375.4" cy="403.3" r="9.6" fill="#102A43"/><text class="serif" font-size="17" font-weight="700" x="355.8" y="408.3" text-anchor="end">AssemblyAI<tspan class="muted" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400"> 1.9%</tspan></text><circle cx="518.2" cy="389.2" r="7.0" fill="#102A43"/><text class="serif" font-size="17" font-weight="700" x="535.2" y="409.2" text-anchor="start">MAI-Transcribe 2<tspan class="muted" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400"> 2.5%</tspan></text><circle cx="490.6" cy="372.7" r="7.0" fill="#102A43"/><text class="serif" font-size="17" font-weight="700" x="473.6" y="377.7" text-anchor="end">GPT Transcribe<tspan class="muted" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400"> 3.2%</tspan></text><circle cx="372.6" cy="328.0" r="20.0" fill="#EEF2F6" fill-opacity="0.7" stroke="#52667A" stroke-width="1.5"/><text class="muted" font-size="14" x="342.6" y="333.0" text-anchor="end">Voxtral Mini<tspan class="muted" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400"> 5.1%</tspan></text><circle cx="536.9" cy="313.8" r="14.8" fill="#EEF2F6" fill-opacity="0.7" stroke="#52667A" stroke-width="1.5"/><text class="muted" font-size="14" x="561.7" y="318.8" text-anchor="start">Voxtral Small<tspan class="muted" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400"> 5.7%</tspan></text><circle cx="509.3" cy="313.8" r="7.0" fill="#EEF2F6" fill-opacity="0.7" stroke="#52667A" stroke-width="1.5"/><text class="muted" font-size="14" x="496.3" y="301.8" text-anchor="end">Scribe v2<tspan class="muted" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400"> 5.7%</tspan></text><circle cx="1173.6" cy="163.2" r="17.4" fill="#EEF2F6" fill-opacity="0.7" stroke="#52667A" stroke-width="1.5"/><text class="muted" font-size="14" x="1146.2" y="168.2" text-anchor="end">Gemini 3.5<tspan class="muted" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400"> 12.1%</tspan></text>

</svg>
