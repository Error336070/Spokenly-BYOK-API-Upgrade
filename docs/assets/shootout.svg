<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="548" viewBox="0 0 1280 548" role="img" aria-labelledby="title desc">
<title id="title">Model shootout results</title>
<desc id="desc">Word error rate against median latency for seven speech-to-text models. AssemblyAI had the lowest error rate at 1.9 percent with 638 ms, MAI-Transcribe 2 had 2.5 percent and removed all fillers, and Gemini 3.5 was slowest and least accurate.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#151B38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
  <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0891B2" stop-opacity="0.26"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect width="1280" height="548" rx="22"/></clipPath>
  <radialGradient id="bubble" cx="0.35" cy="0.35" r="0.75"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></radialGradient>
</defs>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', SFMono-Regular, Consolas, Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.7s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

</style>
<g clip-path="url(#round)">
  <rect width="1280" height="548" fill="url(#bg)"/>
  <rect width="1280" height="548" fill="url(#grid)"/>
  
  <ellipse cx="300" cy="420" rx="380" ry="220" fill="url(#glowV)"/>
  <text x="40" y="58" font-size="22" font-weight="700" fill="#F1F5F9">Model shootout on real dictation</text>
  <text x="40" y="84" font-size="14" fill="#94A3B8">7 recorded clips through OpenRouter. Bigger bubbles kept more filler words.</text>
  <circle cx="790" cy="62" r="8" fill="url(#bubble)" stroke="#22D3EE"/><text x="806" y="67" font-size="14" fill="#94A3B8">in the default config</text><circle cx="980" cy="62" r="8" fill="#64748B" fill-opacity="0.45" stroke="#94A3B8"/><text x="996" y="67" font-size="14" fill="#94A3B8">dropped after testing</text>
  <rect x="120" y="361" width="410" height="109" rx="12" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.35" stroke-dasharray="5 6"/><text x="134" y="383" font-size="13" font-weight="600" fill="#6EE7B7">fast and accurate</text><line x1="120.0" x2="120.0" y1="116" y2="470" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="120.0" y="492" text-anchor="middle" font-size="12.5" fill="#94A3B8">0</text><line x1="298.3" x2="298.3" y1="116" y2="470" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="298.3" y="492" text-anchor="middle" font-size="12.5" fill="#94A3B8">500</text><line x1="476.7" x2="476.7" y1="116" y2="470" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="476.7" y="492" text-anchor="middle" font-size="12.5" fill="#94A3B8">1000</text><line x1="655.0" x2="655.0" y1="116" y2="470" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="655.0" y="492" text-anchor="middle" font-size="12.5" fill="#94A3B8">1500</text><line x1="833.3" x2="833.3" y1="116" y2="470" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="833.3" y="492" text-anchor="middle" font-size="12.5" fill="#94A3B8">2000</text><line x1="1011.7" x2="1011.7" y1="116" y2="470" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="1011.7" y="492" text-anchor="middle" font-size="12.5" fill="#94A3B8">2500</text><line x1="1190.0" x2="1190.0" y1="116" y2="470" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="1190.0" y="492" text-anchor="middle" font-size="12.5" fill="#94A3B8">3000</text><line x1="120" x2="1190" y1="470.0" y2="470.0" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="108" y="474.0" text-anchor="end" font-size="12.5" fill="#94A3B8">0%</text><line x1="120" x2="1190" y1="415.5" y2="415.5" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="108" y="419.5" text-anchor="end" font-size="12.5" fill="#94A3B8">2%</text><line x1="120" x2="1190" y1="361.1" y2="361.1" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="108" y="365.1" text-anchor="end" font-size="12.5" fill="#94A3B8">4%</text><line x1="120" x2="1190" y1="306.6" y2="306.6" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="108" y="310.6" text-anchor="end" font-size="12.5" fill="#94A3B8">6%</text><line x1="120" x2="1190" y1="252.2" y2="252.2" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="108" y="256.2" text-anchor="end" font-size="12.5" fill="#94A3B8">8%</text><line x1="120" x2="1190" y1="197.7" y2="197.7" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="108" y="201.7" text-anchor="end" font-size="12.5" fill="#94A3B8">10%</text><line x1="120" x2="1190" y1="143.2" y2="143.2" stroke="#2A3463" stroke-opacity="0.55"/><text class="mono" x="108" y="147.2" text-anchor="end" font-size="12.5" fill="#94A3B8">12%</text><text x="655" y="518" text-anchor="middle" font-size="14" fill="#94A3B8">median latency (ms)</text><text transform="translate(52 293) rotate(-90)" text-anchor="middle" font-size="14" fill="#94A3B8">word error rate</text><circle class="pop" cx="347.6" cy="418.3" r="12" fill="url(#bubble)" fill-opacity="0.9" stroke="#22D3EE" stroke-opacity="0.8" style="animation-delay:0.00s"/><circle cx="347.6" cy="418.3" r="12" fill="none" stroke="#22D3EE" stroke-width="2"><animate attributeName="r" values="12;26" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><text x="369.6" y="423.3" text-anchor="start" font-size="14" font-weight="700" fill="#F1F5F9">AssemblyAI<tspan class="mono" font-size="12" fill="#94A3B8" font-weight="400"> 1.9%</tspan></text><circle class="pop" cx="491.6" cy="401.9" r="9" fill="url(#bubble)" fill-opacity="0.9" stroke="#22D3EE" stroke-opacity="0.8" style="animation-delay:0.15s"/><circle cx="491.6" cy="401.9" r="9" fill="none" stroke="#22D3EE" stroke-width="2"><animate attributeName="r" values="9;23" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle><text x="510.6" y="419.9" text-anchor="start" font-size="14" font-weight="700" fill="#F1F5F9">MAI-Transcribe 2<tspan class="mono" font-size="12" fill="#94A3B8" font-weight="400"> 2.5%</tspan></text><circle class="pop" cx="463.8" cy="382.9" r="9" fill="url(#bubble)" fill-opacity="0.9" stroke="#22D3EE" stroke-opacity="0.8" style="animation-delay:0.30s"/><circle cx="463.8" cy="382.9" r="9" fill="none" stroke="#22D3EE" stroke-width="2"><animate attributeName="r" values="9;23" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle><text x="448.8" y="368.9" text-anchor="end" font-size="14" font-weight="700" fill="#F1F5F9">GPT Transcribe<tspan class="mono" font-size="12" fill="#94A3B8" font-weight="400"> 3.2%</tspan></text><circle class="pop" cx="344.7" cy="331.1" r="24" fill="#64748B" fill-opacity="0.45" stroke="#94A3B8" stroke-opacity="0.8" style="animation-delay:0.45s"/><text x="310.7" y="336.1" text-anchor="end" font-size="14" font-weight="500" fill="#94A3B8">Voxtral Mini<tspan class="mono" font-size="12" fill="#94A3B8" font-weight="400"> 5.1%</tspan></text><circle class="pop" cx="510.6" cy="314.8" r="18" fill="#64748B" fill-opacity="0.45" stroke="#94A3B8" stroke-opacity="0.8" style="animation-delay:0.60s"/><text x="538.5" y="319.8" text-anchor="start" font-size="14" font-weight="500" fill="#94A3B8">Voxtral Small<tspan class="mono" font-size="12" fill="#94A3B8" font-weight="400"> 5.7%</tspan></text><circle class="pop" cx="482.7" cy="314.8" r="9" fill="#64748B" fill-opacity="0.45" stroke="#94A3B8" stroke-opacity="0.8" style="animation-delay:0.75s"/><text x="467.7" y="300.8" text-anchor="end" font-size="14" font-weight="500" fill="#94A3B8">Scribe v2<tspan class="mono" font-size="12" fill="#94A3B8" font-weight="400"> 5.7%</tspan></text><circle class="pop" cx="1153.3" cy="140.5" r="21" fill="#64748B" fill-opacity="0.45" stroke="#94A3B8" stroke-opacity="0.8" style="animation-delay:0.90s"/><text x="1122.3" y="145.5" text-anchor="end" font-size="14" font-weight="500" fill="#94A3B8">Gemini 3.5<tspan class="mono" font-size="12" fill="#94A3B8" font-weight="400"> 12.1%</tspan></text>

</g>
