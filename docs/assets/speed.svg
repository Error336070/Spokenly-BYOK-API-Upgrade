<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">AssemblyAI latency before and after optimizing</title>
<desc id="desc">Short commands went from 640 to 200 ms, a 12 second dictation from 969 to 551 ms, and a 55 second paragraph from 3254 to 1371 ms.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#151B38"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
  <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0891B2" stop-opacity="0.26"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect width="1280" height="470" rx="22"/></clipPath>
  
</defs>
<style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', SFMono-Regular, Consolas, Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .fade { animation: fade 0.6s ease-out both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

</style>
<g clip-path="url(#round)">
  <rect width="1280" height="470" fill="url(#bg)"/>
  <rect width="1280" height="470" fill="url(#grid)"/>
  
  <ellipse cx="1050" cy="120" rx="360" ry="200" fill="url(#glowC)"/>
  <text x="40" y="58" font-size="22" font-weight="700" fill="#F1F5F9">AssemblyAI latency per dictation</text>
  <text x="40" y="84" font-size="14" fill="#94A3B8">Median of 3 runs on real recordings, October 2026. Lower is better.</text>
  <rect x="760" y="52" width="14" height="14" rx="4" fill="#F59E0B"/><text x="782" y="64" font-size="14" fill="#94A3B8">Before</text><rect x="853.6" y="52" width="14" height="14" rx="4" fill="#A78BFA"/><text x="875.6" y="64" font-size="14" fill="#94A3B8">FLAC upload</text><rect x="985.2" y="52" width="14" height="14" rx="4" fill="#34D399"/><text x="1007.2" y="64" font-size="14" fill="#94A3B8">Native and FLAC</text><text x="40" y="150" font-size="17" font-weight="700" fill="#F1F5F9">Short command</text><text x="40" y="172" font-size="13" fill="#94A3B8">2 to 4 s of audio</text><rect class="grow" x="280" y="124" width="139.6" height="21" rx="5" fill="#F59E0B" fill-opacity="0.78" style="animation-delay:0.00s"/><text class="mono fade" x="429.6" y="140" font-size="13.5" fill="#F1F5F9" style="animation-delay:0.60s">640 ms</text><rect class="grow" x="280" y="153" width="74.2" height="21" rx="5" fill="#A78BFA" fill-opacity="0.78" style="animation-delay:0.12s"/><text class="mono fade" x="364.2" y="169" font-size="13.5" fill="#F1F5F9" style="animation-delay:0.72s">340 ms</text><rect class="grow" x="280" y="182" width="43.6" height="21" rx="5" fill="#34D399" fill-opacity="1" style="animation-delay:0.24s"/><text class="mono fade" x="333.6" y="198" font-size="13.5" fill="#F1F5F9" style="animation-delay:0.84s">200 ms</text><text x="1236" y="168" text-anchor="end" font-size="40" font-weight="800" fill="url(#accent)">3.2x</text><text x="1236" y="190" text-anchor="end" font-size="13" fill="#94A3B8">faster</text><line x1="40" x2="1240" y1="226" y2="226" stroke="#2A3463" stroke-opacity="0.6"/><text x="40" y="266" font-size="17" font-weight="700" fill="#F1F5F9">Typical dictation</text><text x="40" y="288" font-size="13" fill="#94A3B8">12 s of audio</text><rect class="grow" x="280" y="240" width="211.4" height="21" rx="5" fill="#F59E0B" fill-opacity="0.78" style="animation-delay:0.36s"/><text class="mono fade" x="501.4" y="256" font-size="13.5" fill="#F1F5F9" style="animation-delay:0.96s">969 ms</text><rect class="grow" x="280" y="269" width="138.8" height="21" rx="5" fill="#A78BFA" fill-opacity="0.78" style="animation-delay:0.48s"/><text class="mono fade" x="428.8" y="285" font-size="13.5" fill="#F1F5F9" style="animation-delay:1.08s">636 ms</text><rect class="grow" x="280" y="298" width="120.2" height="21" rx="5" fill="#34D399" fill-opacity="1" style="animation-delay:0.60s"/><text class="mono fade" x="410.2" y="314" font-size="13.5" fill="#F1F5F9" style="animation-delay:1.20s">551 ms</text><text x="1236" y="284" text-anchor="end" font-size="40" font-weight="800" fill="url(#accent)">1.8x</text><text x="1236" y="306" text-anchor="end" font-size="13" fill="#94A3B8">faster</text><line x1="40" x2="1240" y1="342" y2="342" stroke="#2A3463" stroke-opacity="0.6"/><text x="40" y="382" font-size="17" font-weight="700" fill="#F1F5F9">Long paragraph</text><text x="40" y="404" font-size="13" fill="#94A3B8">55 s of audio</text><rect class="grow" x="280" y="356" width="710.0" height="21" rx="5" fill="#F59E0B" fill-opacity="0.78" style="animation-delay:0.72s"/><text class="mono fade" x="1000.0" y="372" font-size="13.5" fill="#F1F5F9" style="animation-delay:1.32s">3,254 ms</text><rect class="grow" x="280" y="385" width="355.9" height="21" rx="5" fill="#A78BFA" fill-opacity="0.78" style="animation-delay:0.84s"/><text class="mono fade" x="645.9" y="401" font-size="13.5" fill="#F1F5F9" style="animation-delay:1.44s">1,631 ms</text><rect class="grow" x="280" y="414" width="299.1" height="21" rx="5" fill="#34D399" fill-opacity="1" style="animation-delay:0.96s"/><text class="mono fade" x="589.1" y="430" font-size="13.5" fill="#F1F5F9" style="animation-delay:1.56s">1,371 ms</text><text x="1236" y="400" text-anchor="end" font-size="40" font-weight="800" fill="url(#accent)">2.4x</text><text x="1236" y="422" text-anchor="end" font-size="13" fill="#94A3B8">faster</text>

</g>
<rect x="0.5" y="0.5" width="1279" height="469" rx="22" fill="none" stroke="#2A3463"/>
</svg>
